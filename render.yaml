services:
  - type: web
    name: disaster-response-dashboard
    runtime: node
    rootDir: whatsapp-relief-system
    region: singapore
    buildCommand: npm install
    startCommand: npm run start:web
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /opt/render/project/src/data
    # For production persistence, attach a Render persistent disk
    # from the dashboard and mount it to /opt/render/project/src/data.
